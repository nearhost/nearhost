# Builds the binaries for a release that release-please has already published,
# and attaches them to it. nearhost.dev/install.sh expects these asset names.
version: 2
project_name: nearhost

builds:
  - main: ./cmd/nearhost
    binary: nearhost
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/nearhost/nearhost/internal/cli.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  # Windows is built only while NEARHOST_WINDOWS is "on" (release.yml sets it:
  # on for prereleases, and for every release once Windows ships). With it off
  # a release is exactly the darwin and linux build above. An unset
  # NEARHOST_WINDOWS fails the run, on purpose: release.yml and CI must always
  # set it.
  - id: windows
    main: ./cmd/nearhost
    binary: nearhost
    env:
      - CGO_ENABLED=0
    goos: [windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/nearhost/nearhost/internal/cli.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    skip: '{{ ne .Env.NEARHOST_WINDOWS "on" }}'

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# Signs the darwin binaries with the Developer ID Application certificate and
# has Apple notarise them before they are archived, so Gatekeeper lets them run.
# Always on: the cask no longer clears the quarantine flag, so a release must
# fail rather than ship an unsigned macOS binary when the secrets are missing.
notarize:
  macos:
    - enabled: true
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

# One SBOM per archive, written by syft (the release workflow installs it).
sboms:
  - artifacts: archive

# release-please writes the notes; keep them and only add the assets.
# prerelease: auto marks a tag with a prerelease part (v1.0.0-beta.1) as a
# prerelease and never "latest" when GoReleaser updates the release, so the
# beta that beta.yml created stays one.
changelog:
  disable: true
release:
  mode: keep-existing
  prerelease: auto

homebrew_casks:
  - name: nearhost
    repository:
      owner: nearhost
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://nearhost.dev
    description: Reach local and remote development servers at their own domain (https://<name>.test by default)
    license: MIT
    commit_msg_template: "feat: update nearhost to {{ .Tag }}"
    # A prerelease tag (v1.0.0-rc.1) never reaches the tap.
    skip_upload: auto
