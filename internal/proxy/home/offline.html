<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Can't reach {{if .Machine}}{{.Machine}}{{else}}Nearhost{{end}}</title>
<style>
:root {
  --ground: #0F1210;
  --text: #ECEFE8;
  --muted: #A4ADA5;
  --accent: #D6F26B;
  --display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --body: "DM Sans", ui-sans-serif, system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--ground); }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 16px;
  background: var(--ground);
  color: var(--text);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-wrap: break-word;
}
main { width: 100%; max-width: 34rem; }
h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(32px, 8vw, 48px);
  line-height: 1.1;
  letter-spacing: -0.03em;
  text-wrap: balance;
}
p { margin: 20px 0 0; color: var(--muted); max-width: 32rem; text-wrap: pretty; }
a {
  display: inline-block;
  margin-top: 28px;
  color: var(--accent);
  font-weight: 500;
  text-decoration: none;
  text-underline-offset: 4px;
}
a:hover { text-decoration: underline; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }
</style>
</head>
<body>
<main>
<h1>Can't reach {{if .Machine}}{{.Machine}}{{else}}Nearhost{{end}}</h1>
<p>This device isn't on the network Nearhost serves, or Nearhost isn't running. It tries again when you come back.</p>
<a href="/">Try again</a>
</main>
</body>
</html>
