{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nearhost">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="color-scheme" content="dark">
<title>{{.Title}}</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F1210'/%3E%3Cpath d='M18 52V34a14 14 0 0 1 28 0v18' fill='none' stroke='%23D6F26B' stroke-width='10' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='46' r='5.5' fill='%23ECEFE8'/%3E%3C/svg%3E">
<style>
:root {
  --ground: #0F1210;
  --surface: #161A17;
  --line: #2A312B;
  --text: #ECEFE8;
  --muted: #A4ADA5;
  --accent: #D6F26B;
  --display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --body: "DM Sans", ui-sans-serif, system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--ground); height: 100%; }
body {
  margin: 0;
  height: 100vh;
  height: 100dvh;
  background: var(--ground);
  color: var(--text);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
main { display: flex; flex-direction: column; height: 100%; }
.preview-body { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.bar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0 16px;
  padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.bar .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--display); font-weight: 600; }
.bar a, .bar button {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  font-weight: 500;
  color: var(--accent);
  text-decoration: none;
  text-underline-offset: 4px;
  cursor: pointer;
}
.bar a:hover, .bar button:hover { text-decoration: underline; }
.bar a:focus-visible, .bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
iframe { flex: 1; width: 100%; min-height: 0; border: 0; background: #fff; }
</style>
<script src="/page.js" defer></script>
</head>
<body>
<main id="preview" data-stay>
{{template "main" .}}
</main>
</body>
</html>
{{end}}

{{define "main"}}<div class="preview-body" data-stay>
  <div class="bar">
    <a href="/">Back to Nearhost</a>
    <button type="button" id="preview-back">Back</button>
    <button type="button" id="preview-reload">Reload</button>
    <span class="name">{{.Name}}</span>
    <a href="{{.URL}}" target="_blank" rel="noopener">Open</a>
  </div>
  <iframe id="preview-frame" src="{{.URL}}" referrerpolicy="origin" allow="fullscreen; clipboard-read; clipboard-write" title="{{.Name}}"></iframe>
</div>{{end}}
