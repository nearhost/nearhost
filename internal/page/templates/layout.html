{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{.Title}}</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F1210'/%3E%3Cpath d='M18 52V34a14 14 0 0 1 28 0v18' fill='none' stroke='%23D6F26B' stroke-width='10' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='46' r='5.5' fill='%23ECEFE8'/%3E%3C/svg%3E">
<style>
:root {
  --ground: #0F1210;
  --surface: #161A17;
  --line: #2A312B;
  --text: #ECEFE8;
  --muted: #A4ADA5;
  --accent: #D6F26B;
  --display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --body: "DM Sans", ui-sans-serif, system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--ground); }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 16px;
  background: var(--ground);
  color: var(--text);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-wrap: break-word;
}
main { width: 100%; max-width: 34rem; }
.brand { display: flex; align-items: center; gap: 16px; }
.brand svg { width: 64px; height: 64px; flex: none; }
.wordmark {
  font-family: var(--display);
  font-weight: 600;
  font-size: 32px;
  letter-spacing: -0.03em;
  line-height: 1;
}
h1 {
  margin: 40px 0 0;
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(40px, 9vw, 56px);
  line-height: 1.05;
  letter-spacing: -0.03em;
  text-wrap: balance;
}
h1 span { color: var(--accent); }
p { margin: 20px 0 0; color: var(--muted); max-width: 32rem; text-wrap: pretty; }
nav { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 8px 28px; }
nav a, .docs a {
  color: var(--accent);
  font-weight: 500;
  text-decoration: none;
  text-underline-offset: 4px;
  text-decoration-thickness: 1px;
}
nav a:hover, .docs a:hover { text-decoration: underline; }
nav a:focus-visible, .docs a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }
h2 { margin: 40px 0 0; font-family: var(--display); font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
h2 + p { margin-top: 4px; font-size: 14px; }
.docs ul { margin: 12px 0 0; padding: 0; list-style: none; }
.docs li + li { margin-top: 4px; }
footer {
  margin-top: 48px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 14px;
}
.status ul, .waiting ul { margin: 12px 0 0; padding: 0; list-style: none; }
.status li + li, .waiting li + li { margin-top: 8px; }
.status li span, .waiting li span { color: var(--muted); }
main a {
  color: var(--accent);
  font-weight: 500;
  text-decoration: none;
  text-underline-offset: 4px;
  text-decoration-thickness: 1px;
}
main a:hover { text-decoration: underline; }
main a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }
.asks p:first-child { color: var(--text); }
.answers { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; }
.answers form { margin: 0; }
button {
  font: inherit;
  font-weight: 600;
  padding: 10px 22px;
  border-radius: 10px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--ground);
  cursor: pointer;
}
button.quiet { background: transparent; color: var(--text); border-color: var(--line); }
button:hover { filter: brightness(1.08); }
button.quiet:hover { border-color: var(--muted); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.error { margin-top: 24px; padding: 12px 16px; border: 1px solid var(--line); border-left: 3px solid #F2A65A; border-radius: 8px; color: var(--text); }
</style>
<script src="/page.js" defer></script>
</head>
<body>
<main>
{{template "main" .}}
</main>
</body>
</html>
{{end}}

{{define "main"}}
  <div class="brand">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#0F1210"/>
      <path d="M18 52V34a14 14 0 0 1 28 0v18" fill="none" stroke="#D6F26B" stroke-width="10" stroke-linecap="round"/>
      <circle cx="32" cy="46" r="5.5" fill="#ECEFE8"/>
    </svg>
    <span class="wordmark">nearhost</span>
  </div>
  {{template "content" .}}
  <footer>Nearhost {{.Version}}</footer>
{{end}}

{{define "buttons"}}
  <div class="answers">
    {{- range .}}
    <form method="post" action="{{.Action}}"><input type="hidden" name="csrf" value="{{.CSRF}}"><input type="hidden" name="answer" value="{{.Value}}">{{if .SHA}}<input type="hidden" name="sha" value="{{.SHA}}">{{end}}<button type="submit"{{if .Quiet}} class="quiet"{{end}}>{{.Label}}</button></form>
    {{- end}}
  </div>
{{end}}
