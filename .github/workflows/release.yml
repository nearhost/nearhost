name: release
on:
  release:
    types: [published]
permissions: {}
env:
  # Whether a normal release also builds Windows. Prereleases always do.
  WINDOWS_RELEASES: "on"
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # The release environment admits only main and v* tags, and holds the
    # macOS signing and notary secrets, so no other workflow or ref reads them.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      # NEARHOST_WINDOWS is read by .goreleaser.yaml. A tag with a prerelease
      # part must be a GitHub prerelease, and the reverse, or npm and Homebrew
      # would treat the release wrongly. CI's release-config job checks the
      # script for each combination.
      - name: Set NEARHOST_WINDOWS
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          windows=$(sh .github/scripts/windows-switch.sh) || { echo "$windows"; exit 1; }
          echo "NEARHOST_WINDOWS=$windows" >> "$GITHUB_ENV"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Windows binaries are signed through Azure Artifact Signing by
      # .github/scripts/sign-windows.sh, which GoReleaser runs after each
      # Windows build. The login is OIDC: the app registration trusts only
      # this repo's release environment, and may only sign.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: env.NEARHOST_WINDOWS == 'on'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # jsign signs PE files on Linux (the runner has Java); osslsigncode
      # checks the result.
      - name: Install jsign and osslsigncode
        if: env.NEARHOST_WINDOWS == 'on'
        env:
          JSIGN_VERSION: "7.6"
          JSIGN_SHA256: 6cf58aa080e7ff82656f320cff8d4a3bff30408df8766806dcba3740dd839fa5
        run: |
          jar="$RUNNER_TEMP/jsign.jar"
          curl -fsSL -o "$jar" "https://github.com/ebourg/jsign/releases/download/$JSIGN_VERSION/jsign-$JSIGN_VERSION.jar"
          echo "$JSIGN_SHA256  $jar" | sha256sum -c -
          echo "JSIGN_JAR=$jar" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq osslsigncode
          java -version
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: tap-token
        with:
          client-id: ${{ vars.NH_APP_CLIENT_ID }}
          private-key: ${{ secrets.NH_APP_PRIVATE_KEY }}
          repositories: homebrew-tap
          permission-contents: write
      # GoReleaser shells out to syft to write an SBOM for each archive.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          # Build the release's own tag, even if another tag shares its commit.
          GORELEASER_CURRENT_TAG: ${{ github.event.release.tag_name }}
          # Every Windows build a release makes is signed.
          NEARHOST_SIGN_WINDOWS: ${{ env.NEARHOST_WINDOWS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/checksums.txt

  # Publishes @nearhost/cli and its platform packages from the tarballs
  # goreleaser just attached. npm trusts this workflow for every package
  # (trusted publishing), so there is no token and each version gets
  # provenance.
  npm:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Moving npm's `next` tag over trusted publishing, which publish.mjs
      # does after a normal release, needs npm 11.21.0 or later.
      - run: npm install -g npm@11.21.0
      - run: node npm/build.mjs "$TAG"
        env:
          TAG: ${{ github.event.release.tag_name }}
      - run: node npm/publish.mjs
