name: release
on:
  release:
    types: [published]
permissions: {}
env:
  # Whether a normal release also builds Windows. Prereleases always do. Set
  # this to "on" in the PR that ships Windows, together with its docs.
  WINDOWS_RELEASES: "off"
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      # NEARHOST_WINDOWS is read by .goreleaser.yaml. A tag with a prerelease
      # part must be a GitHub prerelease, and the reverse, or npm and Homebrew
      # would treat the release wrongly.
      - name: Set NEARHOST_WINDOWS
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          case "$TAG" in
            *-*) tag_pre=true ;;
            *) tag_pre=false ;;
          esac
          if [ "$tag_pre" != "$PRERELEASE" ]; then
            echo "::error::tag $TAG and the release's prerelease flag ($PRERELEASE) disagree"
            exit 1
          fi
          if [ "$PRERELEASE" = true ] || [ "$WINDOWS_RELEASES" = on ]; then
            echo "NEARHOST_WINDOWS=on" >> "$GITHUB_ENV"
          else
            echo "NEARHOST_WINDOWS=off" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: tap-token
        with:
          client-id: ${{ vars.NH_APP_CLIENT_ID }}
          private-key: ${{ secrets.NH_APP_PRIVATE_KEY }}
          repositories: homebrew-tap
          permission-contents: write
      # GoReleaser shells out to syft to write an SBOM for each archive.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          NEARHOST_WINDOWS: ${{ env.NEARHOST_WINDOWS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/checksums.txt

  # Publishes @nearhost/cli and its platform packages from the tarballs
  # goreleaser just attached. npm trusts this workflow for every package
  # (trusted publishing), so there is no token and each version gets
  # provenance.
  npm:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: node npm/build.mjs "$TAG"
        env:
          TAG: ${{ github.event.release.tag_name }}
      - run: node npm/publish.mjs
