name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # The whole suite on every OS Nearhost ships for.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -timeout 10m ./...
      # Exercises the per-process transport (Windows' strategy) on Linux too.
      - if: runner.os == 'Linux'
        run: NEARHOST_TRANSPORT=per-process go test -count=1 -race -run 'PerProcess' ./internal/transport/

  # The whole suite under the race detector, as `make race` runs it.
  race:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race -timeout 15m ./...

  # Known vulnerabilities in the code Nearhost calls, in its modules and in
  # the Go standard library it builds with.
  vuln:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  # The release config, checked without publishing anything: GoReleaser's own
  # check, then a snapshot of the archives with the Windows switch off and on.
  # Off must produce today's four archives and nothing for Windows.
  release-config:
    strategy:
      fail-fast: false
      matrix:
        windows: ["off", "on"]
    runs-on: ubuntu-latest
    env:
      NEARHOST_WINDOWS: ${{ matrix.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          install-only: true
      # The step in release.yml that sets NEARHOST_WINDOWS for a release.
      - name: Check the release switch
        run: |
          set -u
          check() {
            got=$(TAG=$1 PRERELEASE=$2 WINDOWS_RELEASES=$3 sh .github/scripts/windows-switch.sh) || got=fails
            echo "$1 prerelease=$2 WINDOWS_RELEASES=$3: $got"
            if [ "$got" != "$4" ]; then
              echo "::error::windows-switch.sh for $1 prerelease=$2 WINDOWS_RELEASES=$3 gave $got, want $4"
              exit 1
            fi
          }
          check v0.13.0 false off off
          check v0.13.0 false on on
          check v0.13.0-rc.1 true off on
          check v0.13.0-rc.1 true on on
          check v0.13.0-rc.1 false off fails
          check v0.13.0-rc.1 false on fails
          check v0.13.0 true off fails
          check v0.13.0 true on fails
      - run: goreleaser check
      # No signing secrets or syft here, so notarising and SBOMs are skipped.
      - run: goreleaser release --snapshot --clean --skip=publish,notarize,sbom,homebrew
      - name: Check the archives
        run: |
          set -eu
          cd dist
          ls -1 *.tar.gz *.zip 2>/dev/null | sort > ../archives.txt || true
          cat ../archives.txt
          want=4
          if [ "$NEARHOST_WINDOWS" = on ]; then want=6; fi
          test "$(wc -l < ../archives.txt)" -eq "$want"
          test "$(grep -cE '_(darwin|linux)_(amd64|arm64)\.tar\.gz$' ../archives.txt)" -eq 4
          if [ "$NEARHOST_WINDOWS" = on ]; then
            test "$(grep -cE '_windows_(amd64|arm64)\.zip$' ../archives.txt)" -eq 2
            test "$(grep -cE '_windows_(amd64|arm64)\.zip$' checksums.txt)" -eq 2
            for z in *_windows_*.zip; do
              unzip -Z1 "$z" | grep -qx nearhost.exe
              unzip -Z1 "$z" | grep -qx LICENSE
              unzip -Z1 "$z" | grep -qx README.md
            done
          else
            if grep -q windows ../archives.txt; then exit 1; fi
          fi

  # The npm packages and their launcher: the build and publish scripts against
  # a fixture release, and the launcher around a real binary. The build test
  # skips the Windows archives where there is no zip and unzip.
  npm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test "npm/test/*.test.mjs"

  # The agent skill's script runs on servers with nothing but sh and curl,
  # and its PowerShell twin on Windows laptops.
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -s sh agents/nearhost/skills/nearhost/scripts/nearhost.sh .github/scripts/windows-switch.sh
      - shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path agents/nearhost/skills/nearhost/scripts/nearhost.ps1 -EnableExit -Severity Error,Warning

  # Run the official presets' fixtures through this build, so a change to the
  # preset engine that breaks a shipped preset fails here before it merges.
  presets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nearhost/presets
          path: presets-registry
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o nearhost ./cmd/nearhost
      - run: make -C presets-registry check NEARHOST="$PWD/nearhost"
