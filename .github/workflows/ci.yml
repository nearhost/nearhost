name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      # Exercises the per-process transport (Windows' strategy) on Linux too.
      - if: runner.os == 'Linux'
        run: NEARHOST_TRANSPORT=per-process go test -count=1 -race -run 'PerProcess' ./internal/transport/

  # Windows is not released yet. This keeps it building and runs the tests
  # written for it, so the per-OS seams cannot rot while the rest lands.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -run 'OnWindows$' ./internal/config/... ./internal/transport/... ./internal/engine/... ./internal/tui/... ./internal/cli/ ./internal/hosts/ ./internal/proxy/ ./internal/agentapi/ ./internal/dockernet/
      - run: go test -count=1 -run 'PerProcess|TestNewChoosesTheStrategy|TestNewIsPerProcessOnWindows' ./internal/transport/
      # The engine on the per-process transport, Windows' strategy.
      - run: go test -count=1 -run 'PerProcess' ./internal/engine/
      # These packages' tests are written to pass on every OS.
      - run: go test ./internal/netbind/... ./internal/documents/... ./internal/oserr/... ./internal/desktop/... ./internal/winsys/... ./internal/update/... ./internal/elevate/... ./internal/testutil/...
      # The skill's PowerShell script, under Windows PowerShell 5.1 and pwsh.
      - run: go test -run 'TestScript|TestPowerShellScript' ./internal/agentapi/

  # The whole suite on Windows. It reports and does not gate until stage 6's
  # last PR moves windows-latest into the matrix above.
  windows-suite:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -count=1 -timeout 10m ./...

  # The agent skill's script runs on servers with nothing but sh and curl,
  # and its PowerShell twin on Windows laptops.
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -s sh agents/nearhost/skills/nearhost/scripts/nearhost.sh
      - shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path agents/nearhost/skills/nearhost/scripts/nearhost.ps1 -EnableExit -Severity Error,Warning

  # Run the official presets' fixtures through this build, so a change to the
  # preset engine that breaks a shipped preset fails here before it merges.
  presets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nearhost/presets
          path: presets-registry
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o nearhost ./cmd/nearhost
      - run: make -C presets-registry check NEARHOST="$PWD/nearhost"
