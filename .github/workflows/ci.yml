name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  # Windows is not released yet. This keeps it building and runs the tests
  # written for it, so the per-OS seams cannot rot while the rest lands.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -run 'OnWindows$' ./internal/config/... ./internal/transport/... ./internal/engine/... ./internal/tui/...
      # These packages' tests are written to pass on every OS.
      - run: go test ./internal/oserr/... ./internal/desktop/... ./internal/winsys/...

  # The agent skill's script runs on servers with nothing but sh and curl.
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -s sh agents/nearhost/skills/nearhost/scripts/nearhost.sh

  # Run the official presets' fixtures through this build, so a change to the
  # preset engine that breaks a shipped preset fails here before it merges.
  presets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nearhost/presets
          path: presets-registry
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o nearhost ./cmd/nearhost
      - run: make -C presets-registry check NEARHOST="$PWD/nearhost"
