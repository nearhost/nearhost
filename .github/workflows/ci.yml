name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # The whole suite on every OS Nearhost ships for.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -timeout 10m ./...
      # Exercises the per-process transport (Windows' strategy) on Linux too.
      - if: runner.os == 'Linux'
        run: NEARHOST_TRANSPORT=per-process go test -count=1 -race -run 'PerProcess' ./internal/transport/

  # TEMPORARY: repeats the two Windows flakes. Removed before merge.
  flakes:
    strategy:
      fail-fast: false
      matrix:
        what:
          - name: lockdiag
            cmd: NEARHOST_LOCK_DIAG=1 go test -count=1 -v -run 'TestDiagGo' ./internal/proxy/
          - name: reload
            cmd: go test -count=5 -timeout 30m -run '^TestARequestJustAfterAReloadIsServedOnWindows$' ./internal/proxy/
          - name: proxy
            cmd: go test -count=1000 -timeout 50m -run '^TestApplyAndStopAreSafeConcurrently$' ./internal/proxy/
          - name: engine
            cmd: go test -count=400 -timeout 40m -run '^TestStoppingOneProjectKeepsOthersServing$' ./internal/engine/
    name: flakes (${{ matrix.what.name }})
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - shell: bash
        run: |
          status=0
          ${{ matrix.what.cmd }} 2>&1 | tee out.txt || status=$?
          echo "FAILURES: $(grep -c -- '^--- FAIL' out.txt)"
          exit $status

  # The agent skill's script runs on servers with nothing but sh and curl,
  # and its PowerShell twin on Windows laptops.
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -s sh agents/nearhost/skills/nearhost/scripts/nearhost.sh
      - shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path agents/nearhost/skills/nearhost/scripts/nearhost.ps1 -EnableExit -Severity Error,Warning

  # Run the official presets' fixtures through this build, so a change to the
  # preset engine that breaks a shipped preset fails here before it merges.
  presets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nearhost/presets
          path: presets-registry
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o nearhost ./cmd/nearhost
      - run: make -C presets-registry check NEARHOST="$PWD/nearhost"
