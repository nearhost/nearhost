name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # The whole suite on every OS Nearhost ships for.
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -timeout 10m ./...
      # Exercises the per-process transport (Windows' strategy) on Linux too.
      - if: runner.os == 'Linux'
        run: NEARHOST_TRANSPORT=per-process go test -count=1 -race -run 'PerProcess' ./internal/transport/

  # The agent skill's script runs on servers with nothing but sh and curl,
  # and its PowerShell twin on Windows laptops.
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -s sh agents/nearhost/skills/nearhost/scripts/nearhost.sh
      - shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path agents/nearhost/skills/nearhost/scripts/nearhost.ps1 -EnableExit -Severity Error,Warning

  # Run the official presets' fixtures through this build, so a change to the
  # preset engine that breaks a shipped preset fails here before it merges.
  presets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nearhost/presets
          path: presets-registry
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o nearhost ./cmd/nearhost
      - run: make -C presets-registry check NEARHOST="$PWD/nearhost"
